appId: com.basistheory.reactnativethreeds.example
---
# Sandbox card 5405001111111116 ("Authentication Rejected") drives the SDK to
# the 'rejected' status without a challenge UI.
- launchApp
- extendedWaitUntil:
    visible: 'Native 3DS ready'
    timeout: 60000
- assertVisible: 'Active strategy: ${STRATEGY}'
- tapOn:
    id: 'card-number-input'
- eraseText: 16
- inputText: '5405001111111116'
- hideKeyboard
- tapOn:
    id: 'checkout-button'
- extendedWaitUntil:
    visible: '${STRATEGY}: rejected'
    timeout: 30000
- stopApp
