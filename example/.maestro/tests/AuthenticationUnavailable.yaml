appId: com.basistheory.reactnativethreeds.example
---
# Sandbox card 5405001111111165 ("Authentication Unavailable") drives the SDK
# to the 'unavailable' status without a challenge UI.
- launchApp
- extendedWaitUntil:
    visible: 'Native 3DS ready'
    timeout: 60000
- tapOn:
    id: 'card-number-input'
- eraseText: 16
- inputText: '5405001111111165'
- hideKeyboard
- tapOn:
    id: 'checkout-button'
- extendedWaitUntil:
    visible: 'bridge: unavailable'
    timeout: 30000
- stopApp
