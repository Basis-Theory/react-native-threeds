appId: com.basistheory.reactnativethreeds.example
---
- launchApp
- extendedWaitUntil:
    visible: 'Native 3DS ready'
    timeout: 60000
- tapOn:
    id: 'card-number-input'
- eraseText: 16
- inputText: '5204247750001471'
- hideKeyboard
- tapOn:
    id: 'checkout-button'
- extendedWaitUntil:
    visible: '(bridge|turboModule): successful'
    timeout: 30000
- stopApp
