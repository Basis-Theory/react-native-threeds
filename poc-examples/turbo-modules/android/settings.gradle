pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'BT 3DS TurboModules POC'

expoAutolinking.useExpoVersionCatalog()

// Build the checked-out Android 3DS SDK as an isolated composite. This avoids
// publishing it or requiring GitHub Packages credentials for the local POC.
includeBuild('../../../poc-support/.native-sdks/android-threeds-turbo-modules') {
  dependencySubstitution {
    substitute module('com.basistheory:android-threeds') using project(':lib')
  }
}

include ':app'
// Expo 57 does not autolink this workspace-root dependency on Android. Keep
// the POC explicit so the TurboModule package is built from local source.
include ':basis-theory_react-native-threeds'
project(':basis-theory_react-native-threeds').projectDir = new File(rootDir, '../../../android')
// Expo autolinks WebView's Java package, but it does not evaluate its Android
// project. Evaluating it lets React Native generate the Fabric CMake files
// required by a clean new-architecture build.
include ':react-native-webview'
project(':react-native-webview').projectDir = new File(rootDir, '../node_modules/react-native-webview/android')
includeBuild(expoAutolinking.reactNativeGradlePlugin)
