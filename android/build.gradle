buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // React Native reads codegenConfig from package.json and creates the Java
    // abstract class that the Kotlin implementation extends.
    libraryName = "BasisTheoryThreeDSSpec"
    codegenJavaPackageName = "com.basistheory.reactnativethreeds"
}

android {
    namespace "com.basistheory.reactnativethreeds"
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            java {
                // The TurboModule is not reachable from JavaScript on Android
                // regardless of the architecture flag — Bridgeless hosts do
                // not expose __turboModuleProxy even when this Kotlin class
                // registers successfully. Always compile and autolink the
                // Bridge adapter on Android instead; it runs on new-arch
                // hosts through React Native's Bridge/TurboModule interop
                // layer, unlike this repository's TurboModule.
                exclude "**/BasisTheoryThreeDSTurbo*.kt"
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
    // com.basistheory:android-threeds depends on Ravelin's public 3DS
    // artifact. Declaring it here also lets IDE sync resolve the adapter model.
    maven { url "https://maven.ravelin.com/public/repositories/threeds2service/" }
    // android-threeds publishes to GitHub Packages (see its own
    // lib/build.gradle `publishing {}` block) — Maven on GitHub Packages
    // requires an authenticated token even for a public repo/package.
    maven {
        url "https://maven.pkg.github.com/basis-theory/android-threeds"
        credentials {
            username = System.getenv("GITHUB_ACTOR") ?: "basis-theory"
            password = System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "com.basistheory:android-threeds:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
}
