buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // React Native reads codegenConfig from package.json and creates the Java
    // abstract class that the Kotlin implementation extends.
    libraryName = "BasisTheoryThreeDSSpec"
    codegenJavaPackageName = "com.basistheory.reactnativethreeds"
}

def newArchitectureEnabled = (findProperty("newArchEnabled") ?: "false").toBoolean()

android {
    namespace "com.basistheory.reactnativethreeds"
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            java {
                // Each POC app compiles only the adapter for the architecture
                // it is proving. This avoids generated-spec references in the
                // RN 0.74 Bridge build and legacy registration in RN 0.86.
                if (newArchitectureEnabled) {
                    exclude "**/BasisTheoryThreeDSBridge*.kt"
                } else {
                    exclude "**/BasisTheoryThreeDSTurbo*.kt"
                }
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
    // The locally substituted Android 3DS SDK depends on Ravelin's public 3DS
    // artifact. Declaring it here also lets IDE sync resolve the adapter model.
    maven { url "https://maven.ravelin.com/public/repositories/threeds2service/" }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "com.basistheory:android-threeds:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
}
